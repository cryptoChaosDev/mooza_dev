# Live on PROD at /opt/mooza/docker-compose.override.yml (docker compose auto-merges it).
# Adds healthchecks + generous mem limits without touching the tracked docker-compose.yml.
services:
  api:
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
  web:
    mem_limit: 128m
    healthcheck:
      # /healthz отвечает сам nginx: «/» теперь проксируется в api (SEO-снимок),
      # и падение api не должно делать web «unhealthy».
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  postgres:
    mem_limit: 1g
