<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />

    <!--
      Вошедшему пользователю серверный снимок страницы (Ф4: <div data-ssr> внутри
      #root) не показываем — иначе до загрузки бандла мелькнёт гостевой вид.
      Скрипт синхронный и стоит первым: класс ставится до первой отрисовки.
    -->
    <script>
      try { if (localStorage.getItem('token')) document.documentElement.classList.add('authed'); } catch (e) {}
    </script>
    <style>.authed #root > [data-ssr] { display: none; }</style>

    <!-- Yandex.Metrika counter: грузится только после согласия на cookies («Принять»).
         Политика конфиденциальности, п. 11.5. До согласия — ни скрипта, ни пикселя. -->
    <script type="text/javascript">
      window.mzLoadMetrika = function () {
        if (window.__mzMetrikaLoaded) return;
        window.__mzMetrikaLoaded = true;
        (function(m,e,t,r,i,k,a){
            m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
            m[i].l=1*new Date();
            for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
            k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)
        })(window, document,'script','https://mc.yandex.ru/metrika/tag.js?id=109562743', 'ym');
        ym(109562743, 'init', {ssr:true, webvisor:false, clickmap:true, ecommerce:"dataLayer", referrer: document.referrer, url: location.href, accurateTrackBounce:true, trackLinks:true});
      };
      try { if (localStorage.getItem('mooza_cookie_consent') === 'all') window.mzLoadMetrika(); } catch (e) {}
    </script>
    <!-- /Yandex.Metrika counter -->

    <!--
      Load the Telegram Mini App SDK only when actually running inside Telegram.
      For regular web visitors (the vast majority) this avoids a render-blocking
      request to telegram.org, which is throttled in some regions (RU) and stalls
      first paint. document.write keeps it synchronous so window.Telegram is ready
      before the app boots when we ARE inside Telegram.
    -->
    <script>
      if (window.TelegramWebviewProxy || /tgWebApp/.test(location.hash) || /tgWebApp/.test(location.search)) {
        document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />

    <!-- PWA -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#6366f1" />
    <!-- Declares the app is dark-themed so Yandex Browser's auto dark-mode does not re-color icons -->
    <meta name="color-scheme" content="dark" />
    <!-- Explicitly disable Yandex Browser's automatic dark-theme re-coloring engine -->
    <meta name="darkreader-lock" content="" />
    <meta name="supported-color-schemes" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Moooza" />

    <!--
      SEO: блок между маркерами seo:head заменяет SEO-снимок (server/src/seo,
      план Ф4) — title/description/canonical/robots/OG/Twitter/JSON-LD страницы.
      Маркеры НЕ удалять и не переименовывать: их наличие проверяет client/Dockerfile.
      canonical здесь нет: его ставит снимок или useSeo (lib/seo.ts) для текущего URL.
    -->
    <!--seo:head-->
    <meta name="description" content="Moooza — социальная сеть для музыкантов" />
    <title>Moooza — Музыкальная социальная сеть</title>
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Moooza" />
    <meta property="og:title"       content="Moooza — Платформа для музыкантов" />
    <meta property="og:description" content="Находите коллег, заказчиков и исполнителей. Создавайте проекты и стройте карьеру в музыкальной индустрии." />
    <meta property="og:image"       content="https://moooza.ru/pwa-512x512.png" />
    <meta property="og:image:width"  content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt"   content="Moooza — социальная сеть для музыкантов" />
    <meta property="og:url"         content="https://moooza.ru" />
    <meta property="og:locale"      content="ru_RU" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Moooza — Платформа для музыкантов" />
    <meta name="twitter:description" content="Находите коллег, заказчиков и исполнителей. Создавайте проекты и стройте карьеру в музыкальной индустрии." />
    <meta name="twitter:image"       content="https://moooza.ru/pwa-512x512.png" />
    <!--/seo:head-->

    <!-- Structured data (JSON-LD): организация и сайт — общие для всех страниц -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://moooza.ru/#organization",
          "name": "Moooza",
          "url": "https://moooza.ru/",
          "logo": "https://moooza.ru/logo.png",
          "description": "Moooza — социальная сеть для музыкантов. Находите коллег, заказчиков и исполнителей, создавайте проекты и стройте карьеру в музыкальной индустрии.",
          "sameAs": [
            "https://t.me/moooza_support"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://moooza.ru/#website",
          "name": "Moooza",
          "url": "https://moooza.ru/",
          "inLanguage": "ru-RU",
          "publisher": { "@id": "https://moooza.ru/#organization" }
        }
      ]
    }
    </script>
  </head>
  <body>
    <!-- Yandex.Metrika noscript fallback -->
    <div id="root"><!--seo:body--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
