# X-Robots-Tag для путей, которые отдаёт сам web-nginx (SPA index.html и статика).
# Публичные страницы со снимками, /login и /register (location ниже) получают
# X-Robots-Tag от api — он зависит от режима индексации (SEO_INDEXABLE).
# Сопоставление по $request_uri, а не $uri: try_files подменяет $uri на /index.html.
# Пустое значение — заголовок не добавляется. Первый совпавший regex побеждает.
map $request_uri $xrobots {
    default "";
    # Приватные разделы (матрица маршрутов, план раздел A) — Disallow в robots.txt
    "~^/(?:messages|chat|friends|connections?|deals|create-post|invite|settings|onboarding|vk-setup|admin|forgot-password)(?:[/?#]|$)" "noindex, nofollow";
    "~^/pro/?(?:[?#]|$)"                                  "noindex, nofollow";
    "~^/profile/?(?:[?#]|$)"                              "noindex, nofollow";
    "~^/profile/[^/?#]+/connections"                      "noindex, nofollow";
    "~^/artist/create"                                    "noindex, nofollow";
    "~^/artist/[^/?#]+/[^?#]"                             "noindex, nofollow";
    "~^/artists/"                                         "noindex, nofollow";
    "~^/(?:services|orders|professions)/(?:new|edit)(?:[/?#]|$)" "noindex, nofollow";
    "~^/orders/?(?:[?#]|$)"                               "noindex, nofollow";
    "~^/lineups/(?:new|[^/?#]+/edit)(?:[/?#]|$)"          "noindex, nofollow";
    # Видны всем, но не индексируются
    "~^/flow-settings/?(?:[?#]|$)"                        "noindex, nofollow";
    "~^/profile/[^/?#]+/(?:services|professions|reviews)" "noindex, follow";
    "~^/professions/"                                     "noindex, follow";
    "~^/index\.html"                                      "noindex";
    "~^/landing\.html"                                    "noindex";
    "~^/legal/"                                           "noindex";
}

# Известные маршруты SPA (зеркало <Route path> в client/src/App.tsx). Всё, что сюда
# не попало и не является файлом, получает тот же index.html (SPA покажет «Не найдено»),
# но с HTTP 404 — иначе поисковики видят «мягкие 404» (Вебмастер: «некорректно
# настроен возврат 404»). ДОБАВЛЯЯ МАРШРУТ В App.tsx — ДОБАВЬ ЕГО И СЮДА.
# Публичные страницы со снимками (артист, релиз, профиль…) обрабатывает api и сам
# отдаёт 404 для несуществующих сущностей.
map $uri $spa_route {
    default 0;
    "~^/(?:admin|create-post|deals|feed|find|flow-settings|forgot-password|friends|invite|lineups|login|messages|onboarding|orders|pro|profile|register|scene|search|privacy|terms|vk-setup)/?$" 1;
    "~^/scene/[^/]+/?$" 1;
    "~^/lineups/(?:new|[^/]+(?:/edit)?)/?$" 1;
    "~^/artist/(?:create|[^/]+)/?$" 1;
    "~^/artist/[^/]+/(?:clips/new|releases/new|vacancies/new|contacts|edit|genres|invite|members/add)/?$" 1;
    "~^/artists/[^/]+/vacancies/?$" 1;
    "~^/(?:chat|clips|connection|deals|messages|releases|vacancies)/[^/]+/?$" 1;
    "~^/(?:connections|friends)/requests/?$" 1;
    "~^/groups/[^/]+/?$" 1;
    "~^/orders/(?:new|edit/[^/]+|[^/]+)/?$" 1;
    "~^/services/(?:new|edit/[^/]+|[^/]+)/?$" 1;
    "~^/professions/(?:new|edit/[^/]+|[^/]+/[^/]+)/?$" 1;
    "~^/profile/[^/]+(?:/(?:connections|professions|reviews|services))?/?$" 1;
    "~^/settings/privacy/?$" 1;
}

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS: имя api резолвится в момент запроса (proxy_pass через
    # переменную), а не при старте — web поднимается и отдаёт SPA, даже если
    # api ещё (или уже) не запущен.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;
    set $api_upstream http://api:4000;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/xml+rss image/svg+xml;
    gzip_disable "msie6";

    # Healthcheck контейнера (docker-compose.override.yml) — без api и без логов.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Service worker & its registration must ALWAYS revalidate. Otherwise the
    # immutable ".js" rule below would pin an old service worker for a year and
    # block PWA autoUpdate — users would stay stuck on a stale bundle after deploys.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }

    # Android-приложение (TWA ru.moooza.app): связь домена с приложением. Без этого
    # файла приложение показывает адресную строку. Отпечаток — ключ подписи APK.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*";
    }

    # APK для установки с сайта (сборка — android/README.md).
    location = /moooza.apk {
        types { application/vnd.android.package-archive apk; }
        add_header Cache-Control "no-cache";
        add_header Content-Disposition 'attachment; filename="moooza.apk"';
        add_header X-Robots-Tag "noindex";
    }

    location = /favicon.ico {
        try_files /favicon.ico /favicon.png =404;
        expires 7d;
    }

    # Hashed static assets — content-hashed filenames, safe to cache forever.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Sound Day — статическая брендовая страница с QR (не React-роут).
    # Должна стоять ПЕРЕД SPA-catch-all, иначе /soundday уедет в index.html.
    location = /soundday {
        try_files /soundday.html =404;
        add_header Cache-Control "no-cache";
    }

    # Старые адреса групп → страница артиста (там — 301 на /artist/<slug>).
    # /groups/create и /groups/invites обрабатывает SPA.
    location ~ ^/groups/(?!create/?$|invites/?$)([^/]+)/?$ {
        return 301 /artist/$1$is_args$args;
    }

    # robots.txt — от api по режиму индексации (server/src/seo/robots.ts):
    # SEO_INDEXABLE=false — прежний закрытый, true — открытый. api недоступен —
    # статический /robots.txt из образа (это тот же прежний закрытый вариант).
    location = /robots.txt {
        proxy_pass $api_upstream/seo/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Connection "";
        proxy_connect_timeout 1s;
        proxy_send_timeout 4s;
        proxy_read_timeout 4s;
        proxy_intercept_errors on;
        error_page 404 429 500 502 503 504 = @robots_static;
    }
    location @robots_static {
        default_type text/plain;
        try_files /robots.txt =404;
    }

    # Динамический sitemap (api: server/src/seo/sitemap.ts). SEO_INDEXABLE=false —
    # прежний sitemap из трёх URL, дочерние файлы — 404.
    location ~ ^/sitemap[a-z0-9-]*\.xml$ {
        proxy_pass $api_upstream/seo$uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Connection "";
        proxy_connect_timeout 1s;
        proxy_send_timeout 4s;
        proxy_read_timeout 15s;
    }

    # SEO-снимки публичных страниц (план, раздел D): api вставляет в настоящий
    # index.html разметку страницы (head + <div data-ssr>). Список зеркалит
    # публичные маршруты App.tsx и server/src/seo/routes.ts.
    #  - X-Forwarded-For/Proto — как пришли от host-nginx (req.ip в api = клиент);
    #  - Authorization/Cookie вырезаются: снимок одинаков для всех;
    #  - api не ответил за 1/4 с или 5xx → обычный index.html со статусом 503
    #    (SPA работает), 429 — тот же index.html с 429 (роботу — сигнал притормозить);
    #  - CSP api на HTML не пропускаем (иначе сломаются инлайн-скрипты index.html).
    # /login и /register — тоже через api: их индексируемость зависит от режима.
    location ~ ^/(?:(?:feed|search|privacy|terms|login|register|scene|scene/[^/]+|artist/[^/]+|releases/[^/]+|clips/[^/]+|profile/[^/]+|services/[^/]+|orders/[^/]+|vacancies/[^/]+|lineups/[^/]+)/?)?$ {
        proxy_pass $api_upstream/seo/render$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Connection "";
        proxy_connect_timeout 1s;
        proxy_send_timeout 4s;
        proxy_read_timeout 4s;
        proxy_hide_header Content-Security-Policy;
        proxy_intercept_errors on;
        error_page 500 502 503 504 =503 /index.html;
        error_page 429 =429 /index.html;
    }

    # SPA entry — never cache index.html, so new asset hashes are picked up
    # immediately on the next load instead of after a heuristic cache expiry.
    location / {
        try_files $uri $uri/ @spa;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Robots-Tag $xrobots;
    }

    # Не файл: известный маршрут SPA — index.html с 200, иначе тот же index.html с 404.
    location @spa {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Robots-Tag $xrobots;
        error_page 404 /index.html;
        if ($spa_route = 0) {
            return 404;
        }
        rewrite ^ /index.html break;
    }
}
